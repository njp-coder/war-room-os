# Switching provider means editing this file only.
# provider: gemini | anthropic | openai_compatible
provider: openai_compatible
base_url: https://llm.hidevs.xyz/v1       # HiDevs hackathon gateway (OpenAI-compatible)
api_key_env: HIDEVS_API_KEY               # put the key in war-room-os/.env, never in this file
budget_tokens: 100000
reasoning_headroom: 1024              # extra tokens for models that think before answering (gemini-3.5-flash does)
roles:
  reason: { model: gemini-3.5-flash }       # root-cause theories, expert advice
  fast:   { model: gemini-3.5-flash-lite }  # symptom lines, card summaries, harness tool picking
  status: { model: gemini-3.5-flash-lite }  # stakeholder questions

# Jev (TypeSafe System One): calibrated yes/no probabilities for "is this signal real?" and "which change caused it?"
jev:
  endpoint: https://openrouter.ai/api/alpha/decisions
  model: "~typesafe/jev-latest"              # "~" alias follows the newest Jev
  api_key_env: OPENROUTER_API_KEY
  timeout_s: 20
